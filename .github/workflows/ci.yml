name: Source and native checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build native modules from source
        run: python tools/build_native.py --compiler cl --jobs 2
      - name: Verify rules and artifact-independent tests
        run: python tools/verify_source.py
